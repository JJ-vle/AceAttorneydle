<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Attorneydle</title>
    <link rel="stylesheet" href="styles/styles.css?v=5">
    <link rel="stylesheet" href="styles/components/tableguess.css">
    <link rel="shortcut icon" href="resources/img/icons/favicon.ico">
    <script src="js/version.js"></script>
</head>
<body>

    <div class="background-blur" id="office"></div>

    <header class="site-header">
    <div class="logo-group"></div>
    </header>

    <div class="info-page">
    </div>
 

    <main>
        <div id="game-container"></div>

        <div id="hint-container"></div>
        
        <div id="defensebar">
            <img src="resources/img/icons/defensebar/defensebar15.png" alt="Figure">
        </div>
        
        <!--
        <div id="a-def"></div>
        -->
        <div id="guessbar">
            <div class="input-prompt">Enter the name of the character you think you've found:</div>
            <div id="guessbarinputs">
                <input type="text" id="guessInput" placeholder="Enter a name..." autocomplete="off" />
                <button id="validateButton" disabled>Validate</button>
            </div>
            <ul id="suggestions"></ul>
        </div>

        <!--<h2>History of tests :</h2>-->
        <div id="history"></div>
        
        <div id="finalresult"></div>

        <div id="groupFilters"></div>
    </main>

    <script type="module">import "./js/guess.js";</script>
    <script type="module">import "./js/common/initPage.js";</script>
    <script type="module">import "./js/logo.js";</script>
    <script type="module">import "./js/common/infoPage.js";</script>
    <script type="module">import "./js/common/filter.js";</script>
    <script type="module">import "./js/common/life.js";</script>
    <script type="module">import "./js/common/hint.js";</script>
    <script type="module">import "./js/common/guessbar.js";</script>
    

    <div id="banner-placeholder"></div>
    <script type="module">
        import { showConsentBanner, initCookieConsent } from './js/common/cookie.js';
        initCookieConsent();
    </script>
    <script type="module">import "./js/common/tableguess-helper.js";</script>


    <div id="loading-indicator">LOADING...</div>
</body>

<footer>
    <div class="content"></div>
</footer>

</html>
