<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Attorneydle</title>
    <link rel="stylesheet" href="styles/styles.css?v=5">
    <link rel="stylesheet" href="styles/components/tableunique.css">
    <link rel="stylesheet" href="styles/components/evidences.css">
    <link rel="shortcut icon" href="resources/img/icons/favicon.ico">

    <script src="js/version.js"></script>
</head>
<body class="single-cell-table">

    <div class="background-blur" id="police"></div>

    <header class="site-header">
    <div class="logo-group">
        <div class="flame-container">
        <img src="resources/img/icons/flame.png" alt="Flamme" class="flame-icon">
        <span class="flame-count">-</span>
        </div>


        <a href="index.html" class="logo-link">
        <img src="resources/img/AceAttorneydleLogo.png" alt="AceAttorneydle Logo" id="logo">
        </a>

        <div class="side-right">
        <button class="icon-btn">
            <img src="resources/img/icons/patchnotes.png" alt="Patch Notes">
        </button>
        <button class="icon-btn">
            <img src="resources/img/icons/param.png" alt="Settings">
        </button>
        <button class="icon-btn">
            <img src="resources/img/icons/questionmark.png" alt="Help">
        </button>
        </div>
    </div>
    </header>

    
    <div class="info-page">
    </div>
    
    <main>
        <div id="game-container">
            <div id="gamemodeSelector">
                <a href="guess"><img src="resources/img/icons/guess.png" alt="Guess"></a>
                <a href="silhouette"><img src="resources/img/icons/silhouette.png" alt="Silhouette"></a>
                <a href="quote"><img src="resources/img/icons/quote.png" alt="Quote"></a>
                <a href="case"><img src="resources/img/icons/case.png" alt="Case" class="selected"></a>
            </div>
        </div>

        <div id="hint-container"></div>
        
        <div id="defensebar">
            <img src="resources/img/icons/defensebar/defensebar15.png" alt="Figure">
        </div>

        <div id="evidence-container">
        </div>

        <div id="guessbar">
            <div class="input-prompt">Enter the case that matches these clues:</div>
            <div id="guessbarinputs">
                <input type="text" id="guessInput" placeholder="Enter a name..." autocomplete="off" />
                <button id="validateButton" disabled>Validate</button>
            </div>
            <ul id="suggestions"></ul>
        </div>

        <!--<h2>History of tests :</h2>-->
        <div id="history"></div>
        
        <div id="finalresult"></div>
        
        <div id="groupFilters"></div>

    </main>

    
    <div id="loading-indicator">LOADING...</div>

    <script type="module">import "./js/case.js";</script>
    <script type="module">import "./js/common/initPage.js";</script>
    <script type="module">import "./js/logo.js";</script>
    <script type="module">import "./js/common/infoPage.js";</script>
    <script type="module">import "./js/common/filter.js";</script>
    <script type="module">import "./js/common/life.js";</script>
    <script type="module">import "./js/common/hint.js";</script>
    <script type="module">import "./js/common/guessbar.js";</script>

    <div id="banner-placeholder"></div>

    <script type="module">
        import { showConsentBanner, initCookieConsent } from './js/common/cookie.js';
        initCookieConsent();
    </script>
</body>

<footer>
    <div class="content"></div>
</footer>
</html>
