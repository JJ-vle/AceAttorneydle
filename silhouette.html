<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Attorneydle</title>
    <link rel="stylesheet" href="styles/styles.css?v=5">
    <link rel="stylesheet" href="styles/components/tableunique.css">
    <link rel="shortcut icon" href="resources/img/icons/favicon.ico">
</head>
<body class="single-cell-table">

    <div class="background-blur" id="detention"></div>

    <header class="site-header">
    <div class="logo-group"></div>
    </header>

    <div class="info-page">
    </div>

    <main>
        <div id="game-container"></div>
        
        <div id="defensebar">
            <img src="resources/img/icons/defensebar/defensebar15.png" alt="Figure">
        </div>

        <div id="hints">
            <div id="silhouette"></div>
            <div id="silhouette-controls" class="silhouette-controls" aria-label="Silhouette hint controls">
                <button type="button" class="silhouette-control locked" data-mode="grayscale-blur" disabled>
                    <img src="resources/img/icons/Psyche-Lock.png" class="hint-icon" alt="Grayscale">
                    <span class="silhouette-control-label">Grayscale</span>
                    <span class="silhouette-control-meta" data-tries-left></span>
                </button>
                <button type="button" class="silhouette-control locked" data-mode="color-blur" disabled>
                    <img src="resources/img/icons/Psyche-Lock.png" class="hint-icon" alt="Color">
                    <span class="silhouette-control-label">Color</span>
                    <span class="silhouette-control-meta" data-tries-left></span>
                </button>
                <button type="button" class="silhouette-control locked" data-mode="original" disabled>
                    <img src="resources/img/icons/Psyche-Lock.png" class="hint-icon" alt="Original">
                    <span class="silhouette-control-label">Original</span>
                    <span class="silhouette-control-meta" data-tries-left></span>
                </button>
            </div>
        </div>

        <div id="guessbar">
            <div class="input-prompt">Enter the name of the character you think you've found:</div>
            <div id="guessbarinputs">
                <input type="text" id="guessInput" placeholder="Enter a name..." autocomplete="off" />
                <button id="validateButton" disabled>Validate</button>
            </div>
            <ul id="suggestions"></ul>
        </div>
        <!--<h2>History of tests :</h2>-->
        <div id="history"></div>
            
        <div id="finalresult"></div>
        
        <div id="groupFilters"></div>
    </main>

    <script type="module" src="js/silhouette.js"></script>
    <script type="module" src="js/common/initPage.js"></script>
    <script type="module" src="js/logo.js"></script>
    <script type="module" src="js/common/infoPage.js"></script>
    <script type="module" src="js/common/filter.js"></script>
    <script type="module" src="js/common/life.js"></script>
    <script type="module" src="js/common/guessbar.js"></script>

    <div id="banner-placeholder"></div>

    
    <div id="loading-indicator">LOADING...</div>

    <script type="module">
        import { showConsentBanner, initCookieConsent } from './js/common/cookie.js';
        initCookieConsent();
    </script>
</body>
<footer>
    <div class="content"></div>
</footer>
</html>
